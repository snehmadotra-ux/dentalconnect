version: '3.8'

services:
  # 1. PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: dentalconnect_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dental_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dental_secure_password}
      POSTGRES_DB: ${POSTGRES_DB:-dentalconnect_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ./storage/postgres:/var/lib/postgresql/data
      - ./docker/postgres/init-zitadel.sh:/docker-entrypoint-initdb.d/init-zitadel.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dental_user} -d ${POSTGRES_DB:-dentalconnect_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - dental_network

  # 2. Redis (Cache & Queue)
  redis:
    image: redis:7-alpine
    container_name: dentalconnect_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - ./storage/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - dental_network

  # 3. MinIO (S3-compatible Object Storage for X-Rays & Dental Scans)
  minio:
    image: minio/minio:latest
    container_name: dentalconnect_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio_secret_key}
    ports:
      - "9000:9000"   # API Port
      - "9001:9001"   # Web Console Port
    volumes:
      - ./storage/minio:/data
    networks:
      - dental_network

  # 4. ZITADEL Identity Provider (AuthN & AuthZ)
  zitadel:
    image: ghcr.io/zitadel/zitadel:v2.68.0
    container_name: dentalconnect_zitadel
    restart: unless-stopped
    command: start-from-init --masterkey "${ZITADEL_MASTERKEY:-MasterkeySecret1234567890123456}" --tlsMode disabled
    environment:
      - ZITADEL_DATABASE_POSTGRES_HOST=db
      - ZITADEL_DATABASE_POSTGRES_PORT=5432
      - ZITADEL_DATABASE_POSTGRES_DATABASE=zitadel
      - ZITADEL_DATABASE_POSTGRES_USER_USERNAME=${POSTGRES_USER:-dental_user}
      - ZITADEL_DATABASE_POSTGRES_USER_PASSWORD=${POSTGRES_PASSWORD:-dental_secure_password}
      - ZITADEL_DATABASE_POSTGRES_USER_SSL_MODE=disable
      - ZITADEL_DATABASE_POSTGRES_ADMIN_USERNAME=${POSTGRES_USER:-dental_user}
      - ZITADEL_DATABASE_POSTGRES_ADMIN_PASSWORD=${POSTGRES_PASSWORD:-dental_secure_password}
      - ZITADEL_DATABASE_POSTGRES_ADMIN_SSL_MODE=disable
      - ZITADEL_EXTERNALSECURE=false
      - ZITADEL_EXTERNALPORT=8080
      - ZITADEL_EXTERNALDOMAIN=localhost
      - ZITADEL_FIRSTINSTANCE_ORG_NAME=DentalConnect
      - ZITADEL_FIRSTINSTANCE_ORG_HUMAN_USERNAME=admin
      - ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORD=${ADMIN_PASSWORD:-AdminSecure123!}
      - ZITADEL_FIRSTINSTANCE_ORG_HUMAN_EMAIL=admin@dentalconnect.com
      - ZITADEL_FIRSTINSTANCE_ORG_HUMAN_DISPLAYNAME=DentalConnect Administrator
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - dental_network

  # 5. FastAPI Python Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dentalconnect_backend
    restart: unless-stopped
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-dental_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-dental_secure_password}
      - POSTGRES_DB=${POSTGRES_DB:-dentalconnect_db}
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-dental_user}:${POSTGRES_PASSWORD:-dental_secure_password}@db:5432/${POSTGRES_DB:-dentalconnect_db}
      - REDIS_HOST=redis
      - MINIO_ENDPOINT=http://minio:9000
      - ZITADEL_ISSUER_URL=http://localhost:8080
      - ZITADEL_INTERNAL_URL=http://zitadel:8080
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - dental_network

  # 6. Next.js Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: dentalconnect_frontend
    restart: unless-stopped
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
      - NEXT_PUBLIC_ZITADEL_ISSUER=http://localhost:8080
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - dental_network

networks:
  dental_network:
    name: dentalconnect_network
    driver: bridge
